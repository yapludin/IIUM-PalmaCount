services:
  - type: web
    name: palma-frontend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r palma-v2/palma-frontend/requirements.txt
    startCommand: gunicorn --chdir palma-v2/palma-frontend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FASTAPI_URL
        value: https://palma-backend-0ii7.onrender.com/api/predict
      - key: DATABASE_URL
        fromDatabase:
          name: palma_db
          property: connectionString

databases:
  - name: palma_db
    region: singapore
    plan: free
    databaseName: palma_analyses
    user: palma_user
