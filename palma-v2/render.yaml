services:
  - type: web
    name: palma-frontend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FASTAPI_URL
        value: https://your-backend-url.onrender.com/api/predict
        sync: false
    databases:
      - name: palma_db
        plan: free

databases:
  - name: palma_db
    region: singapore
    plan: free
    databaseName: palma_analyses
    user: palma_user
